name: FC Online Auto Sync

on:
  schedule:
    - cron: '0 * * * *'  # 매시 정각마다 자동 실행
  workflow_dispatch:      # 수동 테스트 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Sync Script
        run: node sync.js

